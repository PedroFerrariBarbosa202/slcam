name: Documentation Build

on:
  push:
    branches: [dev_doc]
  pull_request:
    branches: [main, dev, dev_doc]

jobs:
  build_user_manual_html:
    name: Build User Manual HTML
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: "docs/user_manual"
          pre-build-command: "pip install -r docs/user_manual/requirements.txt --upgrade pip"

      # Create an artifact of the html output
      - uses: actions/upload-artifact@v7
        with:
          name: documentation_html
          path: docs/user_manual/_build/html/

  build_user_manual_pdf:
    name: Build User Manual PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-english \
            texlive-fonts-extra

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx

          if [ -f docs/user_manual/requirements.txt ]; then
            pip install -r docs/user_manual/requirements.txt
          fi

      - name: Build PDF documentation
        run: |
          make -C docs/user_manual latexpdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation_pdf
          path: docs/user_manual/_build/latex/slb-cam-doc-*.pdf

  build_pdr:
    name: Build PDR Slides
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: docs/pdr
          root_file: main.tex

  build_cdr:
    name: Build CDR Slides
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: docs/cdr
          root_file: main.tex
